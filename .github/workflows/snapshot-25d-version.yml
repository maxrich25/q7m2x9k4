name: Snapshot block-run-25d version

on:
  push:
    branches: [main]
    paths:
      - "block-run-25d/**"

permissions:
  contents: write
  pull-requests: read

jobs:
  snapshot:
    if: github.event_name == "push"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve merged PR for this push
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          SHA="${{ github.sha }}"
          # Prefer the PR that produced this merge commit.
          NUM=$(gh pr list --state merged --search "$SHA" --json number,mergeCommit \
            --jq ".[] | select(.mergeCommit.oid == \"$SHA\") | .number" | head -n1)
          if [ -z "$NUM" ]; then
            NUM=$(gh api "repos/${{ github.repository }}/commits/$SHA/pulls" \
              --jq '.[0].number' 2>/dev/null || true)
          fi
          if [ -z "$NUM" ] || [ "$NUM" = "null" ]; then
            echo "No merged PR for $SHA — skip snapshot"
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "pr=$NUM" >> "$GITHUB_OUTPUT"
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Snapshot block-run-25d
        if: steps.pr.outputs.skip != '1'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node scripts/snapshot-25d-version.mjs --from-pr "${{ steps.pr.outputs.pr }}"

      - name: Commit snapshot if changed
        if: steps.pr.outputs.skip != '1'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add versions/
          if git diff --cached --quiet; then
            echo "No snapshot changes"
            exit 0
          fi
          git commit -m "chore: snapshot block-run-25d for PR #${{ steps.pr.outputs.pr }}"
          git push
