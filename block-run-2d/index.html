<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BLOCK RUN</title>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta name="theme-color" content="#07060c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="description" content="BLOCK RUN. NES-style night block. Buy from the plug, drive deals, stash at the crib." />
  <script>
    (function () {
      var BUILD = "117";
      var CART = "25";
      try {
        var prev = localStorage.getItem("br_build");
        var params = new URLSearchParams(location.search);
        var urlV = params.get("v");
        var key = "br2d_reloaded_" + BUILD;
        if (prev !== BUILD || (urlV && urlV !== CART)) {
          localStorage.setItem("br_build", BUILD);
          if (window.caches) {
            caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
          }
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
          if (!sessionStorage.getItem(key)) {
            sessionStorage.setItem(key, "1");
            var u = new URL(location.href);
            u.searchParams.set("v", CART);
            u.searchParams.set("fresh", "clear");
            location.replace(u.href);
            return;
          }
        }
        localStorage.setItem("br_build", BUILD);
      } catch (e) {}
    })();
  </script>
  <link rel="icon" type="image/svg+xml" href="../block-run/favicon.svg?v=25" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <link rel="stylesheet" href="style.css?v=25" />
</head>
<body class="title-open">
  <div id="app">
    <div id="view">
      <canvas id="game" width="256" height="224" aria-label="BLOCK RUN street"></canvas>
      <div id="phone" class="sheet hidden">
        <div class="sheet-card">
          <h2>PHONE</h2>
          <p id="phone-cash" class="sheet-line">CASH $0130</p>
          <p id="phone-inv" class="sheet-line">GRN 0</p>
          <div id="phone-texts"></div>
          <div id="phone-deal" class="hidden">
            <button type="button" class="accent" data-role="accept">ACCEPT</button>
            <button type="button" data-role="stall">STALL</button>
          </div>
          <button type="button" data-role="phone-close">CLOSE</button>
        </div>
      </div>
      <div id="crib" class="sheet hidden">
        <div class="sheet-card">
          <h2>CRIB</h2>
          <p id="crib-meta" class="sheet-line">HOME</p>
          <button type="button" class="accent" data-role="crib-save">SAVE</button>
          <button type="button" data-role="crib-stash">STASH CASH</button>
          <button type="button" data-role="crib-close">LEAVE</button>
        </div>
      </div>
      <div id="pause" class="sheet hidden">
        <div class="sheet-card">
          <h2>PAUSED</h2>
          <p id="pause-meta" class="sheet-line">v25</p>
          <button type="button" class="accent" data-role="resume">RESUME</button>
          <button type="button" id="btn-sound" data-role="mute">SOUND ON</button>
          <a class="sheet-btn" href="../?menu=1">QUIT</a>
        </div>
      </div>
    </div>
    <div id="chrome">
      <button type="button" id="btn-menu" data-role="pause">MENU</button>
    </div>
    <div id="pad" class="gb sa title-hide">
      <div id="gb-grill" aria-hidden="true"></div>
      <div id="gb-face">
        <div id="pad-foot">
          <div id="gb-dpad">
            <button type="button" class="pad-btn gb-dir" data-role="left" aria-label="left"><i class="dir-arrow" aria-hidden="true"></i></button>
            <button type="button" class="pad-btn gb-dir" data-role="right" aria-label="right"><i class="dir-arrow" aria-hidden="true"></i></button>
          </div>
        </div>
        <div id="pad-car" class="hidden">
          <button type="button" class="pad-btn pad-pedal pad-brake" data-role="brake">BRAKE</button>
          <button type="button" class="pad-btn pad-pedal pad-gas" data-role="gas">GAS</button>
          <div id="shifter" data-role="shifter">
            <div id="shift-track">
              <div id="shift-gears">
                <button type="button" class="gear" data-role="gear" data-gear="P">P</button>
                <button type="button" class="gear" data-role="gear" data-gear="R">R</button>
                <button type="button" class="gear" data-role="gear" data-gear="N">N</button>
                <button type="button" class="gear" data-role="gear" data-gear="D">D</button>
              </div>
              <div id="shift-rail" aria-hidden="true"><i id="shift-knob"></i></div>
            </div>
            <div id="shift-hint" class="hidden">HOLD BRAKE</div>
          </div>
        </div>
        <div id="gb-btns">
          <div id="gb-face-grid" class="face-grid">
            <button type="button" id="btn-car" class="face-btn face-tl" data-role="car">
              <span id="btn-car-label">CAR</span>
            </button>
            <button type="button" id="btn-x" class="face-btn face-tr" data-role="phone">
              <span id="btn-x-label">PHONE</span>
            </button>
            <button type="button" id="btn-b" class="face-btn face-bl" data-role="run">
              <span id="btn-b-label">RUN</span>
            </button>
            <button type="button" id="btn-action" class="face-btn face-br" data-role="act">
              <span id="btn-action-label">ACT</span>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="../art/rims/alternates/rims.js?v=25"></script>
  <script src="audio.js?v=25"></script>
  <script src="sprites/walk14.js?v=25"></script>
  <script src="sprites/chain24.js?v=25"></script>
  <script src="sprites/driver-overlay.js?v=25"></script>
  <script src="game.js?v=25"></script>
</body>
</html>
