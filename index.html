<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BLOCK RUN</title>
  <meta name="theme-color" content="#07060c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BLOCK RUN" />
  <meta name="description" content="BLOCK RUN. NES-style night block. Drive deals, hit the plug, stash at the crib." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./block-run-25d/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./block-run/favicon.svg?v=9" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root {
      --bg: #07060c;
      --pink: #e21b7a;
      --cyan: #3de0ff;
      --gold: #f0c430;
      --cream: #f4f0e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--cream);
      font-family: "Press Start 2P", ui-monospace, monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      background:
        radial-gradient(ellipse at 20% 0%, rgba(226, 27, 122, 0.22), transparent 46%),
        radial-gradient(ellipse at 90% 100%, rgba(61, 224, 255, 0.16), transparent 42%),
        repeating-linear-gradient(90deg, #0c0a14 0 18px, #0a0810 18px 36px);
    }
    main {
      width: min(420px, 100%);
      text-align: center;
    }
    .tag {
      color: var(--cyan);
      font-size: 8px;
      letter-spacing: 3px;
      margin: 0 0 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 3px;
    }
    h1 span { color: var(--pink); }
    .cali {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 6px;
      margin: 0 0 28px;
      text-shadow: 0 0 12px rgba(240, 196, 48, 0.55);
    }
    .picks {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    a.pick, button.pick {
      display: block;
      width: 100%;
      text-decoration: none;
      color: var(--cream);
      border: 3px solid #3a3644;
      background: #121018;
      padding: 22px 14px 18px;
      min-height: 92px;
      font-family: inherit;
      cursor: pointer;
    }
    a.pick:hover, a.pick:focus-visible, button.pick:hover, button.pick:focus-visible {
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(61, 224, 255, 0.28);
      outline: none;
    }
    a.pick.classic:hover, a.pick.classic:focus-visible {
      border-color: var(--pink);
      box-shadow: 0 0 18px rgba(226, 27, 122, 0.3);
    }
    a.pick strong, button.pick strong {
      display: block;
      font-size: 16px;
      line-height: 1.45;
      margin-bottom: 10px;
      letter-spacing: 1px;
    }
    a.pick em, button.pick em {
      display: block;
      font-style: normal;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.5;
    }
    a.pick.plus strong, button.pick.start strong { color: var(--cyan); }
    a.pick.classic strong { color: var(--pink); }
    button.pick.more { min-height: 72px; padding: 16px 14px; }
    button.pick.more strong { font-size: 8px; color: var(--gold); margin-bottom: 0; }
    #more-panel { display: none; flex-direction: column; gap: 12px; }
    #more-panel.open { display: flex; }
    #more-panel a.pick { min-height: 72px; padding: 16px 14px; }
    #more-panel a.pick strong { font-size: 8px; }
    footer {
      margin-top: 26px;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">NIGHT ARCADE</p>
    <h1>BLOCK<br><span>RUN</span></h1>
    <p class="cali">CALI</p>
    <div class="picks">
      <a class="pick plus start" href="./block-run-2d/?v=9&fresh=clear">
        <strong>START</strong>
        <em>DRIVE DEALS ON THE NIGHT BLOCK</em>
      </a>
      <button type="button" class="pick more" id="btn-more">
        <strong>MORE</strong>
      </button>
      <div id="more-panel">
        <a class="pick plus" href="./block-run-25d/?v=79&fresh=clear">
          <strong>2.5D</strong>
          <em>LATEST NIGHT-STREET PROTOTYPE</em>
        </a>
        <a class="pick classic" href="./block-run/?v=58&fresh=clear">
          <strong>CLASSIC</strong>
          <em>ORIGINAL 2D SHOOTER</em>
        </a>
        <a class="pick" href="./versions/">
          <strong>OLDER VERSIONS</strong>
          <em>PLAY ANY PAST 2.5D BATCH</em>
        </a>
      </div>
    </div>
    <footer>TAP START</footer>
  </main>
  <script>
    document.getElementById("btn-more").addEventListener("click", () => {
      const panel = document.getElementById("more-panel");
      const open = panel.classList.toggle("open");
      document.getElementById("btn-more").querySelector("strong").textContent = open ? "LESS" : "MORE";
    });
  </script>
</body>
</html>
