<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BLOCK RUN</title>
  <meta name="theme-color" content="#07060c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BLOCK RUN" />
  <meta name="description" content="BLOCK RUN. NES-style night block. Drive deals, hit the plug, stash at the crib." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./block-run-25d/apple-touch-icon.png" />
  <link rel="icon" type="image/svg+xml" href="./block-run/favicon.svg?v=9" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root {
      --bg: #07060c;
      --pink: #e21b7a;
      --cyan: #3de0ff;
      --gold: #f0c430;
      --cream: #f4f0e8;
      --mint: #5ad89a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--cream);
      font-family: "Press Start 2P", ui-monospace, monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      background:
        radial-gradient(ellipse at 20% 0%, rgba(226, 27, 122, 0.22), transparent 46%),
        radial-gradient(ellipse at 90% 100%, rgba(61, 224, 255, 0.16), transparent 42%),
        repeating-linear-gradient(90deg, #0c0a14 0 18px, #0a0810 18px 36px);
    }
    main {
      width: min(420px, 100%);
      text-align: center;
    }
    .tag {
      color: var(--cyan);
      font-size: 8px;
      letter-spacing: 3px;
      margin: 0 0 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 3px;
    }
    h1 span { color: var(--pink); }
    .cali {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 6px;
      margin: 0 0 28px;
      text-shadow: 0 0 12px rgba(240, 196, 48, 0.55);
    }
    .picks {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    a.pick, button.pick {
      display: block;
      width: 100%;
      text-decoration: none;
      color: var(--cream);
      border: 3px solid #3a3644;
      background: #121018;
      padding: 18px 14px 16px;
      min-height: 84px;
      font-family: inherit;
      cursor: pointer;
    }
    /* Latest is the main action; More / Back stay secondary. */
    a.pick.latest, button.pick.latest {
      min-height: 118px;
      padding: 26px 16px 22px;
      border-color: #4a6270;
    }
    a.pick.latest strong, button.pick.latest strong {
      font-size: 20px;
      margin-bottom: 10px;
    }
    a.pick.more, button.pick.more,
    a.pick.back, button.pick.back {
      min-height: 72px;
      padding: 14px 14px 12px;
    }
    a.pick.more strong, button.pick.more strong,
    a.pick.back strong, button.pick.back strong {
      font-size: 12px;
      margin-bottom: 6px;
    }
    a.pick:hover, a.pick:focus-visible, button.pick:hover, button.pick:focus-visible {
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(61, 224, 255, 0.28);
      outline: none;
    }
    a.pick.shoot:hover, a.pick.shoot:focus-visible,
    button.pick.shoot:hover, button.pick.shoot:focus-visible {
      border-color: var(--pink);
      box-shadow: 0 0 18px rgba(226, 27, 122, 0.3);
    }
    a.pick.more:hover, a.pick.more:focus-visible,
    button.pick.more:hover, button.pick.more:focus-visible {
      border-color: var(--gold);
      box-shadow: 0 0 18px rgba(240, 196, 48, 0.28);
    }
    a.pick.back:hover, a.pick.back:focus-visible,
    button.pick.back:hover, button.pick.back:focus-visible {
      border-color: #6a6674;
      box-shadow: none;
    }
    a.pick strong, button.pick strong {
      display: block;
      font-size: 14px;
      line-height: 1.45;
      margin-bottom: 8px;
      letter-spacing: 1px;
    }
    a.pick em, button.pick em {
      display: block;
      font-style: normal;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.5;
    }
    a.pick.latest strong, button.pick.latest strong,
    button.pick.line strong { color: var(--cyan); }
    a.pick.shoot strong, button.pick.shoot strong { color: var(--pink); }
    a.pick.safe strong, button.pick.safe strong { color: var(--mint); }
    a.pick.more strong, button.pick.more strong { color: var(--gold); }
    a.pick.back strong, button.pick.back strong { color: #a8a4b4; }
    footer {
      margin-top: 26px;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">NIGHT ARCADE</p>
    <h1>BLOCK<br><span>RUN</span></h1>
    <p class="cali">CALI</p>
    <div class="picks" id="menu-line">
      <button type="button" class="pick line" data-go="2d-mode">
        <strong>2D</strong>
        <em>ON-FOOT BLOCK</em>
      </button>
      <button type="button" class="pick line" data-go="25d-ver">
        <strong>2.5D</strong>
        <em>NIGHT STREET</em>
      </button>
    </div>
    <div class="picks" id="menu-2d-mode" style="display:none">
      <button type="button" class="pick shoot" data-go="2d-shoot-ver">
        <strong>SHOOTING</strong>
        <em>CLASSIC PACKS + GUNS</em>
      </button>
      <button type="button" class="pick safe" data-go="2d-safe-ver">
        <strong>NON-SHOOTING</strong>
        <em>DRIVE DEALS ON THE BLOCK</em>
      </button>
      <button type="button" class="pick back" data-go="line">
        <strong>BACK</strong>
        <em>MAIN MENU</em>
      </button>
    </div>
    <div class="picks" id="menu-2d-shoot-ver" style="display:none">
      <a class="pick latest shoot" href="./block-run/?v=58&fresh=clear">
        <strong>LATEST</strong>
        <em>CLASSIC SHOOTER</em>
      </a>
      <!-- Only other real 2D shooter cart is legacy — no 2.5D archives here. -->
      <a class="pick more" href="./block-run/legacy/">
        <strong>MORE</strong>
        <em>OLDER CLASSIC 2D BUILD</em>
      </a>
      <button type="button" class="pick back" data-go="2d-mode">
        <strong>BACK</strong>
        <em>2D MODE</em>
      </button>
    </div>
    <div class="picks" id="menu-2d-safe-ver" style="display:none">
      <!-- Sole non-shooting 2D cart — no More until another 2D deals build exists. -->
      <a class="pick latest" href="./block-run-2d/?v=19&fresh=clear">
        <strong>LATEST</strong>
        <em>CURRENT 2D DEALS</em>
      </a>
      <button type="button" class="pick back" data-go="2d-mode">
        <strong>BACK</strong>
        <em>2D MODE</em>
      </button>
    </div>
    <div class="picks" id="menu-25d-ver" style="display:none">
      <a class="pick latest" href="./block-run-25d/?v=90&fresh=clear&play=1">
        <strong>LATEST</strong>
        <em>CURRENT NIGHT STREET</em>
      </a>
      <a class="pick more" href="./versions/">
        <strong>MORE</strong>
        <em>OLDER 2.5D BATCHES</em>
      </a>
      <button type="button" class="pick back" data-go="line">
        <strong>BACK</strong>
        <em>MAIN MENU</em>
      </button>
    </div>
    <footer id="menu-foot">PICK A CART</footer>
  </main>
  <script>
    const panels = {
      line: document.getElementById("menu-line"),
      "2d-mode": document.getElementById("menu-2d-mode"),
      "2d-shoot-ver": document.getElementById("menu-2d-shoot-ver"),
      "2d-safe-ver": document.getElementById("menu-2d-safe-ver"),
      "25d-ver": document.getElementById("menu-25d-ver"),
    };
    const foot = document.getElementById("menu-foot");
    const feet = {
      line: "PICK A CART",
      "2d-mode": "SHOOTING OR DEALS",
      "2d-shoot-ver": "CLASSIC 2D",
      "2d-safe-ver": "2D DEALS",
      "25d-ver": "2.5D",
    };
    function show(id) {
      Object.entries(panels).forEach(([key, el]) => {
        el.style.display = key === id ? "" : "none";
      });
      foot.textContent = feet[id] || "PICK A CART";
    }
    document.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", () => show(btn.dataset.go));
    });
  </script>
</body>
</html>
