<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BLOCK RUN</title>
  <meta name="theme-color" content="#07060c" />
  <meta name="description" content="BLOCK RUN arcade. Classic 2D cart or the 2.5D night-street prototype." />
  <link rel="icon" type="image/svg+xml" href="./block-run/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root {
      --bg: #07060c;
      --pink: #e21b7a;
      --cyan: #3de0ff;
      --gold: #f0c430;
      --cream: #f4f0e8;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--cream);
      font-family: "Press Start 2P", ui-monospace, monospace;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom));
      background:
        radial-gradient(ellipse at 20% 0%, rgba(226, 27, 122, 0.22), transparent 46%),
        radial-gradient(ellipse at 90% 100%, rgba(61, 224, 255, 0.16), transparent 42%),
        repeating-linear-gradient(90deg, #0c0a14 0 18px, #0a0810 18px 36px);
    }
    main {
      width: min(420px, 100%);
      text-align: center;
    }
    .tag {
      color: var(--cyan);
      font-size: 8px;
      letter-spacing: 3px;
      margin: 0 0 16px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 28px;
      line-height: 1.2;
      letter-spacing: 3px;
    }
    h1 span { color: var(--pink); }
    .cali {
      color: var(--gold);
      font-size: 10px;
      letter-spacing: 6px;
      margin: 0 0 28px;
      text-shadow: 0 0 12px rgba(240, 196, 48, 0.55);
    }
    .picks {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    a.pick {
      display: block;
      text-decoration: none;
      color: var(--cream);
      border: 3px solid #3a3644;
      background: #121018;
      padding: 22px 14px 18px;
      min-height: 92px;
    }
    a.pick:hover, a.pick:focus-visible {
      border-color: var(--cyan);
      box-shadow: 0 0 18px rgba(61, 224, 255, 0.28);
      outline: none;
    }
    a.pick.classic:hover, a.pick.classic:focus-visible {
      border-color: var(--pink);
      box-shadow: 0 0 18px rgba(226, 27, 122, 0.3);
    }
    a.pick strong {
      display: block;
      font-size: 11px;
      line-height: 1.45;
      margin-bottom: 10px;
    }
    a.pick em {
      display: block;
      font-style: normal;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.5;
    }
    a.pick.plus strong { color: var(--cyan); }
    a.pick.classic strong { color: var(--pink); }
    footer {
      margin-top: 26px;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">NIGHT ARCADE</p>
    <h1>BLOCK<br><span>RUN</span></h1>
    <p class="cali">CALI</p>
    <div class="picks">
      <a class="pick classic" href="./block-run/?v=46&fresh=fat">
        <strong>BLOCK RUN<br>(CLASSIC)</strong>
        <em>2D PIXEL SIDE-VIEW</em>
      </a>
      <a class="pick plus" href="./block-run-25d/?v=46&fresh=fat">
        <strong>BLOCK RUN 2.5D</strong>
        <em>DRIVE DEALS ON THE NIGHT BLOCK</em>
      </a>
    </div>
    <footer>TAP A MODE TO START</footer>
  </main>
  <script type="module">
    import { bindAudioUnlock, unlockAudio, startMusic } from "./block-run-25d/js/audio.js?v=45";
    bindAudioUnlock();
    const go = () => {
      unlockAudio();
      startMusic();
    };
    document.addEventListener("pointerdown", go, { capture: true, passive: true });
    document.addEventListener("touchstart", go, { capture: true, passive: true });
  </script>
</body>
</html>
