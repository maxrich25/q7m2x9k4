<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BLOCK RUN</title>
  <meta name="theme-color" content="#07060c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="BLOCK RUN" />
  <meta name="description" content="BLOCK RUN. NES-style night block. Drive deals, hit the plug, stash at the crib." />
  <link rel="manifest" href="./manifest.json" />
  <link rel="apple-touch-icon" href="./block-run-25d/apple-touch-icon-v107.png" />
  <link rel="icon" type="image/svg+xml" href="./block-run/favicon.svg?v=9" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <!-- Cold open → 2.5D drone title. ?menu=1 keeps this 2D / 2.5D picker. -->
  <script>
    (function () {
      var BUILD = "107";
      try {
        var prev = localStorage.getItem("br_build");
        if (prev !== BUILD) {
          localStorage.setItem("br_build", BUILD);
          if (window.caches) {
            caches.keys().then(function (ks) { ks.forEach(function (k) { caches.delete(k); }); });
          }
          if (navigator.serviceWorker) {
            navigator.serviceWorker.getRegistrations().then(function (rs) {
              rs.forEach(function (r) { r.unregister(); });
            });
          }
        }
      } catch (e) {}
      var params = new URLSearchParams(location.search);
      if (params.has("menu")) return;
      location.replace("./block-run-25d/?v=107&fresh=nuke&play=1");
    })();
  </script>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <style>
    :root {
      --bg: #07060c;
      --pink: #e21b7a;
      --cyan: #3de0ff;
      --gold: #f0c430;
      --cream: #f4f0e8;
      --mint: #5ad89a;
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0;
      min-height: 100%;
      min-height: 100dvh;
      background: var(--bg);
      color: var(--cream);
      font-family: "Press Start 2P", ui-monospace, monospace;
      -webkit-user-select: none;
      user-select: none;
      -webkit-touch-callout: none;
    }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: calc(20px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) calc(20px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left));
      background:
        radial-gradient(ellipse at 20% 0%, rgba(226, 27, 122, 0.22), transparent 46%),
        radial-gradient(ellipse at 90% 100%, rgba(61, 224, 255, 0.16), transparent 42%),
        repeating-linear-gradient(90deg, #0c0a14 0 18px, #0a0810 18px 36px);
    }
    main {
      width: min(420px, 100%);
      text-align: center;
    }
    .tag { color: var(--cyan); font-size: 8px; letter-spacing: 3px; margin: 0 0 14px; }
    h1 { margin: 0; font-size: 28px; line-height: 1.2; letter-spacing: 2px; }
    h1 span { color: var(--pink); }
    .cali { color: var(--gold); font-size: 10px; margin: 10px 0 28px; letter-spacing: 4px; }
    .picks { display: flex; flex-direction: column; gap: 12px; }
    .pick {
      display: block; text-decoration: none; color: var(--cream);
      border: 3px solid #3a3644; background: #121018; padding: 16px 12px;
      font-family: inherit; cursor: pointer; width: 100%;
    }
    .pick strong { display: block; font-size: 14px; margin-bottom: 6px; }
    .pick em { display: block; font-style: normal; font-size: 7px; color: #8a8696; line-height: 1.5; }
    .pick.line strong { color: var(--cyan); }
    .pick.shoot strong { color: var(--pink); }
    .pick.safe strong { color: var(--mint); }
    .pick.back strong { color: #8a8696; }
    .pick:hover, .pick:focus-visible { border-color: var(--gold); outline: none; }
    footer {
      margin-top: 26px;
      font-size: 7px;
      color: #8a8696;
      line-height: 1.6;
    }
  </style>
</head>
<body>
  <main>
    <p class="tag">NIGHT ARCADE</p>
    <h1>BLOCK<br><span>RUN</span></h1>
    <p class="cali">CALI</p>
    <div class="picks" id="menu-line">
      <button type="button" class="pick line" data-go="2d-mode">
        <strong>2D</strong>
        <em>ON-FOOT BLOCK</em>
      </button>
      <a class="pick line" href="./block-run-25d/?v=107&fresh=nuke&play=1">
        <strong>2.5D</strong>
        <em>NIGHT STREET TITLE</em>
      </a>
    </div>
    <div class="picks" id="menu-2d-mode" style="display:none">
      <button type="button" class="pick shoot" data-go="2d-shoot-ver">
        <strong>2D SHOOTING</strong>
        <em>CLASSIC PACKS + GUNS</em>
      </button>
      <button type="button" class="pick safe" data-go="2d-safe-ver">
        <strong>2D NON-SHOOTING</strong>
        <em>DRIVE DEALS ON THE BLOCK</em>
      </button>
      <button type="button" class="pick back" data-go="line">
        <strong>BACK</strong>
        <em>MAIN MENU</em>
      </button>
    </div>
    <div class="picks" id="menu-2d-shoot-ver" style="display:none">
      <a class="pick latest shoot" href="./block-run/?v=58&fresh=clear">
        <strong>PLAY 2D SHOOTING</strong>
        <em>CLASSIC SHOOTER</em>
      </a>
      <a class="pick more" href="./block-run/legacy/">
        <strong>MORE</strong>
        <em>OLDER CLASSIC 2D BUILD</em>
      </a>
      <button type="button" class="pick back" data-go="2d-mode">
        <strong>BACK</strong>
        <em>2D MODE</em>
      </button>
    </div>
    <div class="picks" id="menu-2d-safe-ver" style="display:none">
      <a class="pick latest" href="./block-run-2d/?v=19&fresh=clear">
        <strong>PLAY 2D NON-SHOOTING</strong>
        <em>CURRENT 2D DEALS</em>
      </a>
      <button type="button" class="pick back" data-go="2d-mode">
        <strong>BACK</strong>
        <em>2D MODE</em>
      </button>
    </div>
    <footer id="menu-foot">PICK A CART</footer>
  </main>
  <script>
    const panels = {
      line: document.getElementById("menu-line"),
      "2d-mode": document.getElementById("menu-2d-mode"),
      "2d-shoot-ver": document.getElementById("menu-2d-shoot-ver"),
      "2d-safe-ver": document.getElementById("menu-2d-safe-ver"),
    };
    const foot = document.getElementById("menu-foot");
    const feet = {
      line: "PICK A CART",
      "2d-mode": "2D SHOOTING OR NON-SHOOTING",
      "2d-shoot-ver": "2D SHOOTING",
      "2d-safe-ver": "2D NON-SHOOTING",
    };
    function show(id) {
      Object.entries(panels).forEach(([key, el]) => {
        el.style.display = key === id ? "" : "none";
      });
      foot.textContent = feet[id] || "PICK A CART";
    }
    document.querySelectorAll("[data-go]").forEach((btn) => {
      btn.addEventListener("click", () => show(btn.dataset.go));
    });
    show("line");
  </script>
</body>
</html>
