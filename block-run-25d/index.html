<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>BLOCK RUN 2.5D</title>
  <meta name="theme-color" content="#07060c" />
  <meta http-equiv="Cache-Control" content="no-cache" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="description" content="2.5D night-street prototype of BLOCK RUN. Jump to dodge, sell packs, drive deals, buy guns." />
  <link rel="icon" type="image/svg+xml" href="../block-run/favicon.svg" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" />
  <!-- Cache bust: GitHub Pages max-age=600. Bump ?v= here, on js/main.js, and every relative import in js/*.js (see README). -->
  <link rel="stylesheet" href="style.css?v=12" />
  <script type="importmap">
  {
    "imports": {
      "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
    }
  }
  </script>
</head>
<body>
  <div id="app">
    <div id="view">
      <canvas id="scene" aria-label="BLOCK RUN 2.5D street"></canvas>
      <div id="hud" aria-live="polite">
        <div id="hud-top">
          <span id="hud-cash">$0000</span>
          <span id="hud-gun">PISTOL</span>
          <span id="hud-heat" title="heat"></span>
          <span id="hud-wave">W1</span>
          <span id="hud-hp"></span>
          <span id="hud-car" class="hidden" title="car"></span>
          <button id="btn-mute" type="button" aria-label="mute">ON</button>
        </div>
        <div id="phone" class="hidden">
          <div id="phone-from">TXT</div>
          <div id="phone-msg">yo need 2 packs, by the liquor store</div>
          <div id="phone-timer">0:28</div>
        </div>
        <div id="deal-nav" class="hidden">
          <div id="deal-dist">DEAL 340m →</div>
          <div id="deal-map"><i id="deal-me"></i><i id="deal-pin"></i></div>
        </div>
        <div id="prompt" class="hidden">ENTER</div>
        <div id="pops"></div>
        <div id="edge-left" class="edge-arrow hidden" aria-hidden="true">◀</div>
        <div id="edge-right" class="edge-arrow hidden" aria-hidden="true">▶</div>
        <div id="dest-left" class="dest-arrow hidden" aria-hidden="true">◀ DEAL</div>
        <div id="dest-right" class="dest-arrow hidden" aria-hidden="true">DEAL ▶</div>
        <div id="overlay">
          <div id="overlay-card">
            <h1 id="overlay-title">BLOCK<br><span>RUN</span></h1>
            <p id="overlay-sub">2.5D NIGHT BLOCK</p>
            <p id="overlay-body">JUMP TO DODGE<br>SELL PACKS  BUY GUNS<br>DRIVE DEALS  HEAT CALLS COPS</p>
            <p id="overlay-hi"></p>
            <p id="overlay-prompt" class="blink">TAP FOR SOUND</p>
          </div>
        </div>
      </div>
    </div>
    <div id="pad">
      <div id="pad-move">
        <button type="button" class="pad-btn" data-role="left">L</button>
        <button type="button" class="pad-btn pad-jump" data-role="jump">JUMP</button>
        <button type="button" class="pad-btn" data-role="right">R</button>
      </div>
      <button type="button" class="pad-btn pad-fire" data-role="fire">FIRE</button>
    </div>
  </div>
  <p id="status" class="sr-only">title</p>
  <script type="module" src="js/main.js?v=12"></script>
</body>
</html>
